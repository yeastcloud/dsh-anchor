name: Release

# 发版：可选递增版本 → 全量检查 → 构建 → 提交并打 tag → 发布 npm（可信发布，无需 token）→ 建 GitHub Release。
# 用法：
#   gh workflow run release.yml -f bump=patch                 # 递增并发布
#   gh workflow run release.yml -f bump=none                  # 不改版本，把仓库当前版本发出去
#   gh workflow run release.yml -f bump=patch -f dry_run=true # 只验证链路，不提交不发版
# 发布方式：mode=stage（默认，暂存到 npm 后由维护者用 2FA 确认）/ mode=direct（直接发布，
# 需要 npmjs 上该包的 trusted publisher 授予 npm publish 权限，而不是仅 npm stage publish）。
# 前置：npmjs 上该包已配好 Trusted Publisher（首次发布需先手动发一次）。
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 版本递增方式（none = 不改版本，直接发布仓库里当前版本）
        type: choice
        options: [patch, minor, major, none]
        default: patch
      mode:
        description: 发布方式（stage = 暂存到 npm 由你 2FA 确认；direct = 直接发布）
        type: choice
        options: [stage, direct]
        default: stage
      dry_run:
        description: 只跑检查与构建，不提交、不打 tag、不发布
        type: boolean
        default: false

permissions:
  contents: write # 提交版本号并推 tag
  id-token: write # npm 可信发布（OIDC）

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Bump version
        if: ${{ inputs.bump != 'none' }}
        run: npm version "${{ inputs.bump }}" --no-git-tag-version

      - name: Resolve version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Typecheck · test · build
        run: pnpm check

      # 本项目直推 main：若发版前没同步上一个发版提交，工作流会在旧 HEAD 上跑完，
      # 发出一个"内容与上版完全相同"的版本（0.5.0 就是这么来的）。有递增就必须能在
      # CHANGELOG 里找到对应段落，否则直接失败。
      - name: Require a CHANGELOG entry for the new version
        if: ${{ inputs.bump != 'none' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 里没有 ${VERSION} 的段落——先补 CHANGELOG 再发版，避免发出与上版相同的空版本"
            exit 1
          fi

      # bump=none 时跳过提交（版本已经在仓库里），但 tag 不存在仍会补打——
      # 这样"重跑一次失败的发布"不需要再升一个版本。
      - name: Commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.bump }}" != "none" ]; then
            git commit -am "release: v${VERSION}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          if ! git ls-remote --exit-code --tags origin "v${VERSION}" >/dev/null 2>&1; then
            git tag -a "v${VERSION}" -m "release: v${VERSION}"
            git push origin "v${VERSION}"
          fi

      # npm 的可信发布需要较新的 CLI（Node 22 自带的 npm 可能偏旧）
      - name: Upgrade npm
        if: ${{ !inputs.dry_run }}
        run: npm install -g npm@latest

      - name: Publish to npm (trusted publishing)
        if: ${{ !inputs.dry_run }}
        run: |
          if [ "${{ inputs.mode }}" = "stage" ]; then
            npm stage publish --provenance --access public
          else
            npm publish --provenance --access public
          fi

      # Release 笔记优先取 CHANGELOG.md 里本版本的段落：本项目直推 main，没有 PR 可让
      # --generate-notes 汇总，自动生成的结果只剩一个 compare 链接。缺段落时退回自动生成。
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          notes="$(mktemp)"
          section="$(awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {inside=1; next} inside && /^## \[/ {exit} inside {print}' CHANGELOG.md)"
          if [ -n "$section" ]; then
            printf '%s\n' "$section" > "$notes"
            previous="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
            if [ -n "$previous" ]; then
              link="compare/${previous}...${tag}"
            else
              link="commits/${tag}"
            fi
            printf '\n**Full Changelog**: https://github.com/%s/%s\n' "$REPO" "$link" >> "$notes"
            edit_args=(--notes-file "$notes")
            create_args=(--notes-file "$notes")
          else
            echo "::warning::CHANGELOG.md 里没有 ${VERSION} 的段落，Release 笔记退回自动生成"
            # ★ gh 的 `release edit` **没有** `--generate-notes`（只有 `create` 有）⇒ 别想当然 ✗
            #   ⇒ edit 分支只改标题（保留既有笔记），自动生成只在 create 分支使用 ✓
            edit_args=()
            create_args=(--generate-notes)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" "${edit_args[@]}"
          else
            gh release create "$tag" --title "$tag" "${create_args[@]}"
          fi
